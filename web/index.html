<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tjson FHIR Browser</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="theme-dark">
  <div class="top">
    <div class="topline">
      <strong>tjson FHIR Browser</strong>
      <span class="badge">open source</span>
      <span class="topline-spacer"></span>
      <button type="button" class="icon-btn" id="btnLoadToggle" title="Load Bundle" aria-label="Load Bundle" aria-expanded="false" aria-controls="loadDialog">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7h5l2 2h11v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          <path d="M12 12v6M9 15h6"/>
        </svg>
      </button>
      <button type="button" class="btn" id="btnTheme" title="Toggle light/dark">Theme</button>
    </div>
    <div class="sub">
      Browse a FHIR Bundle as <strong>TJSON</strong> (default) or JSON.
      <a href="../docs/USER_GUIDE.md">User guide</a>
      <a href="../README.md">README</a>
      <a href="https://github.com/WorldVistA/tjson-FHIR-browser">GitHub</a>
    </div>
  </div>

  <div class="load-backdrop" id="loadBackdrop" hidden></div>
  <div class="load-dialog" id="loadDialog" role="dialog" aria-modal="true" aria-labelledby="loadDialogTitle" hidden>
    <div class="load-dialog-head">
      <strong id="loadDialogTitle">Load FHIR Bundle</strong>
      <button type="button" class="icon-btn" id="btnLoadClose" title="Close" aria-label="Close load dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div class="load-panel" id="loadPanel">
      <div class="load-row">
        <label for="urlInput">URL</label>
        <input type="url" id="urlInput" placeholder="https://example.org/fhir/Patient/123/$everything or …/Bundle.json">
        <button type="button" class="btn primary" id="btnLoadUrl">Load URL</button>
        <button type="button" class="btn" id="btnLoadExample">Load example</button>
      </div>
      <div class="load-row">
        <label for="fileInput">File</label>
        <input type="file" id="fileInput" accept=".json,application/json,application/fhir+json">
      </div>
      <div>
        <label for="pasteInput" class="paste-label">Paste JSON</label>
        <textarea id="pasteInput" placeholder='{"resourceType":"Bundle","type":"collection","entry":[…]}'></textarea>
        <div class="load-row paste-actions">
          <button type="button" class="btn primary" id="btnLoadPaste">Load paste</button>
          <button type="button" class="btn" id="btnClearPaste">Clear</button>
        </div>
      </div>
      <div class="err" id="loadError" hidden></div>
    </div>
  </div>

  <div class="wrap">
    <section class="left">
      <div class="bar"><input id="q" placeholder="Search text"></div>
      <div class="bar">
        <select id="type">
          <option value="all">All resource types</option>
        </select>
      </div>
      <div id="list" class="list"></div>
    </section>
    <section class="right">
      <div class="bar bar-meta">
        <span id="meta">Load a Bundle to begin</span>
        <div class="fmtbtns">
          <button type="button" class="fmtbtn" id="btnTjson">TJSON</button>
          <button type="button" class="fmtbtn" id="btnJson">JSON</button>
        </div>
      </div>
      <pre id="detail">Select a resource</pre>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
